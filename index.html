<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Числа до 6: состав и примеры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Neucha&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fdf8ef; --ink:#4a3f5c; --soft:#8a7f99;
    --a:#e0574f;  /* первая часть — красная акварель */
    --b:#3f7fcf;  /* вторая часть — синяя акварель */
    --g:#4f9f45;  /* зелёные яблоки */
    --ok:#5aa84f; --sun:#f5c55a;
    --r:30px 24px 34px 26px / 26px 34px 24px 30px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Comfortaa","Nunito","Trebuchet MS",system-ui,sans-serif;
    color:var(--ink); background-color:var(--paper);
    /* зерно акварельной бумаги */
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .32  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
    overflow-x:hidden; user-select:none;
  }
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
  .hand{font-family:"Neucha","Comfortaa","Trebuchet MS",sans-serif}

  /* ---------- акварельные пятна на фоне ---------- */
  .blob{position:fixed;z-index:-2;border-radius:50%;filter:url(#wc);pointer-events:none}
  .blob.b1{width:260px;height:240px;left:-80px;top:-70px;background:radial-gradient(circle at 45% 45%,rgba(250,214,120,.55),rgba(250,214,120,.28) 62%,rgba(236,180,70,.45) 70%,transparent 72%)}
  .blob.b2{width:340px;height:300px;right:-120px;bottom:-110px;background:radial-gradient(circle at 50% 50%,rgba(246,170,170,.42),rgba(246,170,170,.2) 62%,rgba(230,130,130,.38) 70%,transparent 72%)}
  .blob.b3{width:220px;height:200px;right:-60px;top:22%;background:radial-gradient(circle,rgba(150,195,240,.38),rgba(150,195,240,.18) 62%,rgba(110,160,220,.35) 70%,transparent 72%)}
  .blob.b4{width:200px;height:180px;left:-70px;bottom:12%;background:radial-gradient(circle,rgba(170,215,150,.4),rgba(170,215,150,.18) 62%,rgba(120,180,100,.35) 70%,transparent 72%)}

  /* ---------- универсальная «заливка акварелью» ---------- */
  .wash{position:relative;isolation:isolate;border-radius:var(--r)}
  .wash::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;
    background-color:var(--w,#fff);
    background-image:radial-gradient(ellipse at 28% 22%,rgba(255,255,255,.75),rgba(255,255,255,0) 55%),
                     radial-gradient(ellipse at 75% 85%,rgba(255,255,255,.35),rgba(255,255,255,0) 45%);
    box-shadow:inset 0 0 0 2.5px var(--we,rgba(160,130,100,.25)),inset 0 0 22px var(--we,rgba(160,130,100,.18));
    filter:url(#wc)}
  .w-cream{--w:#fffaf0;--we:rgba(214,186,140,.45)}
  .w-pink{--w:#fde3e1;--we:rgba(232,140,135,.55)}
  .w-blue{--w:#e1edfb;--we:rgba(110,160,225,.55)}
  .w-green{--w:#e3f3dc;--we:rgba(120,185,100,.55)}
  .w-yellow{--w:#fff1c9;--we:rgba(230,180,70,.6)}
  .w-lilac{--w:#ede4f8;--we:rgba(160,130,210,.5)}
  .w-peach{--w:#ffe8d6;--we:rgba(235,160,110,.55)}
  .w-mint{--w:#dcf3ee;--we:rgba(90,180,160,.5)}
  .w-ok{--w:#9fd68f;--we:rgba(70,150,60,.7)}
  .w-sun{--w:#fbd877;--we:rgba(215,160,40,.75)}
  .w-white{--w:#fffdf8;--we:rgba(200,175,140,.4)}

  .screen{display:none;min-height:100vh;padding:14px 16px 28px;flex-direction:column;align-items:center}
  .screen.on{display:flex}

  /* ---------- шапка ---------- */
  .top{width:100%;max-width:980px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .icon-btn{width:54px;height:54px;display:grid;place-items:center;flex:none;transition:transform .15s}
  .icon-btn:hover{transform:rotate(-4deg) scale(1.04)}
  .icon-btn:active{transform:scale(.92)}
  .icon-btn svg{width:30px;height:30px;filter:url(#wob)}
  .progress{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .pip{width:20px;height:20px;border-radius:50%;filter:url(#wc);
       background:radial-gradient(circle at 40% 35%,#fff,#efe3cf 60%,#cdb894 100%)}
  .pip.done{background:radial-gradient(circle at 38% 32%,#fff3c4,#f7cf62 55%,#e2a93a 100%)}
  .pip.now{background:radial-gradient(circle at 40% 35%,#fff,#d9cbee 55%,#8f7db3 100%);transform:scale(1.2)}

  /* ---------- меню ---------- */
  h1{font-family:"Neucha","Comfortaa","Trebuchet MS",sans-serif;font-weight:400;font-size:clamp(38px,6.5vw,62px);margin:14px 0 2px;text-align:center;letter-spacing:.5px}
  h1 .c1{color:var(--a)} h1 .c2{color:var(--b)} h1 .c3{color:#e3a53a} h1 .c4{color:var(--g)}
  .sub{color:var(--soft);margin:0 0 18px;text-align:center;font-size:17px;max-width:560px;line-height:1.45}
  .sub .ra{color:var(--a);font-weight:700} .sub .rb{color:var(--b);font-weight:700}
  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:18px;width:100%;max-width:980px}
  .mode{padding:16px 18px 18px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .18s}
  .mode:nth-child(2){--r:24px 34px 26px 32px / 32px 24px 34px 26px}
  .mode:nth-child(3){--r:34px 28px 24px 30px / 24px 30px 34px 28px}
  .mode:hover{transform:translateY(-4px) rotate(-.6deg)}
  .mode:active{transform:scale(.97)}
  .mode .pic{height:76px;display:flex;align-items:flex-end;gap:2px}
  .mode .pic svg{height:100%;width:auto}
  .mode .pic .op{font-family:"Neucha","Comfortaa","Trebuchet MS",sans-serif;font-size:44px;line-height:76px;color:var(--ink);opacity:.7}
  .mode b{font-family:"Neucha","Comfortaa","Trebuchet MS",sans-serif;font-weight:400;font-size:30px}
  .mode span{color:var(--soft);font-size:14.5px;line-height:1.4}
  .group-title{width:100%;max-width:980px;font-family:"Neucha","Comfortaa","Trebuchet MS",sans-serif;font-size:26px;color:var(--soft);margin:24px 0 10px;display:flex;align-items:center;gap:10px}
  .group-title:after{content:"";flex:1;height:4px;border-radius:4px;background:linear-gradient(90deg,rgba(200,170,130,.35),transparent);filter:url(#wob)}

  /* ---------- игровая область ---------- */
  .stage{width:100%;max-width:980px;flex:1;display:flex;flex-direction:column;align-items:center;gap:14px}
  .prompt{font-family:"Neucha","Comfortaa","Trebuchet MS",sans-serif;font-size:clamp(26px,4.2vw,38px);text-align:center;min-height:1.2em;margin:2px 0 0;line-height:1.2}
  .scene{width:100%;padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:280px;justify-content:center}
  .eq{font-size:clamp(34px,6vw,56px);font-weight:700;display:flex;align-items:center;gap:.25em;flex-wrap:wrap;justify-content:center}
  .eq .ca{color:var(--a)} .eq .cb{color:var(--b)} .eq .cg{color:var(--g)}
  .eq .q{display:inline-grid;place-items:center;min-width:1.35em;height:1.3em;color:#b8acc9;position:relative}
  .eq .q:before{content:"";position:absolute;inset:0;border:3.5px dashed #cdbfdc;border-radius:22px 16px 20px 14px;filter:url(#wob)}
  .eq .q.filled{color:var(--ok)}
  .eq .q.filled:before{border:none;background:radial-gradient(ellipse at 35% 30%,rgba(255,255,255,.8),rgba(190,230,170,.75) 60%,rgba(120,185,95,.55) 100%);filter:url(#wc);z-index:-1}

  /* фишки — капли краски */
  .tok{width:clamp(46px,8.2vw,70px);height:clamp(46px,8.2vw,70px);border-radius:50%;flex:none;filter:url(#wc)}
  .tok.ra{background:radial-gradient(circle at 36% 30%,#ffd0c8 0,#f08a80 38%,#e2665e 68%,#c4443f 100%)}
  .tok.rb{background:radial-gradient(circle at 36% 30%,#d6e8ff 0,#7fb0ea 38%,#4f8dd8 68%,#2f68b4 100%)}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}

  /* карточки ответов */
  .answers{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:4px}
  .ans{width:clamp(94px,15vw,126px);padding:12px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
  .ans:nth-child(2){--r:24px 32px 26px 30px / 30px 24px 32px 26px}
  .ans:nth-child(3){--r:32px 26px 24px 30px / 26px 30px 32px 24px}
  .ans:hover{transform:translateY(-3px) rotate(1deg)}
  .ans:active{transform:scale(.94)}
  .ans .dg{font-size:clamp(40px,7vw,56px);font-weight:700;line-height:1}
  .ans.right{--w:#d9f1cf;--we:rgba(90,168,79,.75);transform:scale(1.06)}
  .ans.wrong{animation:shake .4s}
  .ans.dim{opacity:.35;pointer-events:none}
  .ans.hint{animation:wiggle 1s infinite}
  .ans.hint::after{content:"";position:absolute;inset:-8px;border-radius:inherit;border:4px solid rgba(245,197,90,.9);filter:url(#wc);z-index:-2}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  @keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

  .dice{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:64px;height:64px;padding:6px;border-radius:16px 12px 15px 11px;background:rgba(237,228,248,.6)}
  .dice i{border-radius:50%}
  .dice i.on{background:radial-gradient(circle at 35% 30%,#8a7fa0,#4a3f5c 75%)}
  .dice.cb i.on{background:radial-gradient(circle at 35% 30%,#a9cbf3,#3f7fcf 75%)}
  .dice.ca i.on{background:radial-gradient(circle at 35% 30%,#f7b2aa,#e0574f 75%)}

  /* ---------- божья коровка ---------- */
  .bug{position:relative;width:min(330px,78vw);aspect-ratio:1/1.05}
  .bug .head{position:absolute;left:50%;top:0;width:36%;aspect-ratio:1.4/1;transform:translateX(-50%);border-radius:50% 50% 42% 42%;filter:url(#wc);
    background:radial-gradient(circle at 40% 35%,#7b6d8e,#4a3f5c 70%,#3a3048)}
  .bug .eye{position:absolute;top:2.5%;width:7%;aspect-ratio:1;border-radius:50%;background:#fff;z-index:2}
  .bug .eye:after{content:"";position:absolute;width:50%;height:50%;left:30%;top:35%;border-radius:50%;background:#3a3048}
  .bug .eye.e1{left:39%}.bug .eye.e2{right:39%}
  .bug .ant{position:absolute;top:-6%;width:16%;height:12%;border:4px solid #4a3f5c;border-bottom:none;border-left:none;border-radius:0 80% 0 0;filter:url(#wob)}
  .bug .ant.a1{left:30%;transform:scaleX(-1)} .bug .ant.a2{right:30%}
  .bug .wing{position:absolute;top:15%;width:50%;height:82%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center;padding:20% 9% 16%}
  .bug .wing::before{content:"";position:absolute;inset:0;border-radius:inherit;filter:url(#wc);z-index:-1}
  .bug .wing.l{left:0;border-radius:100% 8% 30% 100%/90% 8% 50% 100%}
  .bug .wing.r{right:0;border-radius:8% 100% 100% 30%/8% 90% 100% 50%}
  .bug .wing.l::before{background:radial-gradient(ellipse at 40% 35%,#ffc9c2,#f08a80 45%,#e2665e 75%,#c4443f 100%)}
  .bug .wing.r::before{background:radial-gradient(ellipse at 60% 35%,#fff,#fde6e3 60%,#f2b9b3 100%)}
  .bug .wing.r.done::before{background:radial-gradient(ellipse at 60% 35%,#e3efff,#9cc3f0 45%,#5d97dc 78%,#3a72bd 100%)}
  .bug .wrap{position:absolute;inset:0;isolation:isolate}
  .bug .spot{width:min(86%,46px);aspect-ratio:1;border-radius:50%;filter:url(#wc);background:radial-gradient(circle at 38% 32%,#7d6f90,#3d3350 75%)}
  .bug .wing.r .spot{background:radial-gradient(circle at 38% 32%,#6f8cc0,#1f3e7a 75%)}
  .bug .cell{width:100%;height:100%;display:grid;place-items:center}
  .bug .spot.pop{animation:pop .4s both}
  .bug .q{position:absolute;right:25%;top:56%;transform:translate(50%,-50%);font-family:"Neucha","Comfortaa","Trebuchet MS",sans-serif;font-size:70px;color:#3f7fcf;opacity:.5}
  @keyframes pop{from{transform:scale(0)}70%{transform:scale(1.15)}to{transform:scale(1)}}
  .total-tag{display:flex;align-items:center;gap:12px;padding:6px 16px;font-weight:700;font-size:26px}

  /* ---------- прятки ---------- */
  .meadow{position:relative;width:100%;max-width:640px;height:210px;border-radius:30px 26px 34px 24px;overflow:hidden;isolation:isolate}
  .meadow .sky{position:absolute;inset:0;background:linear-gradient(#d8ebfa,#eef6fb 60%);z-index:-3}
  .meadow .sunny{position:absolute;left:6%;top:10%;width:56px;height:56px;border-radius:50%;filter:url(#wc);background:radial-gradient(circle at 40% 40%,#fff3c4,#f8d26a 60%,#eab04a);z-index:-2}
  .meadow .cloud{position:absolute;right:12%;top:12%;width:90px;height:34px;border-radius:30px;background:rgba(255,255,255,.85);filter:url(#wc);z-index:-2}
  .meadow .grass{position:absolute;left:-4%;right:-4%;bottom:-6px;height:48%;border-radius:50% 50% 0 0/24% 30% 0 0;filter:url(#wc);z-index:-1;
    background:radial-gradient(ellipse at 30% 10%,#d7efc4,#b4dd98 50%,#93c975 100%)}
  .meadow .bunnies{position:absolute;left:0;right:0;bottom:14px;display:flex;align-items:flex-end}
  .bunny{width:clamp(42px,9vw,60px);height:auto;flex:0 1 auto;min-width:0}
  .bush{position:absolute;bottom:-4px;right:3%;width:54%;height:158px;transition:transform .9s ease-in,opacity .9s;filter:url(#wc)}
  .bush i{position:absolute;border-radius:50%}
  .bush i:nth-child(1){left:0;bottom:0;width:48%;height:78%;background:radial-gradient(circle at 40% 35%,#a8d98c,#6dbb55 60%,#4c9a3a)}
  .bush i:nth-child(2){left:26%;bottom:18%;width:50%;height:82%;background:radial-gradient(circle at 40% 35%,#b9e39d,#79c460 60%,#559f42)}
  .bush i:nth-child(3){right:0;bottom:0;width:50%;height:76%;background:radial-gradient(circle at 40% 35%,#a2d488,#64b34d 60%,#468f35)}
  .bush i:nth-child(4){left:20%;bottom:0;width:62%;height:50%;background:radial-gradient(circle at 50% 30%,#8fcb73,#5aa845 70%)}
  .bush .lbl{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:"Neucha","Comfortaa","Trebuchet MS",sans-serif;font-size:56px;color:#fff;text-shadow:0 2px 0 rgba(60,120,40,.5);filter:none}
  .bush.away{transform:translateX(125%) rotate(18deg);opacity:0}
  .underline{height:7px;border-radius:6px;margin-top:3px;filter:url(#wob)}

  /* ---------- примеры ---------- */
  .basket{position:relative;min-height:150px;width:100%;max-width:600px;display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;padding:10px 16px 26px;isolation:isolate}
  .basket::before{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;border-radius:12px 12px 120px 120px/12px 12px 70px 70px;z-index:-1;filter:url(#wc);
    background:repeating-linear-gradient(115deg,rgba(255,255,255,0) 0 14px,rgba(255,255,255,.28) 14px 18px),
               repeating-linear-gradient(65deg,rgba(150,90,40,0) 0 14px,rgba(150,90,40,.18) 14px 18px),
               radial-gradient(ellipse at 50% 20%,#f8d9a8,#e8b674 60%,#cf9450)}
  .basket::after{content:"";position:absolute;left:-2%;right:-2%;top:36%;height:16px;border-radius:12px;background:radial-gradient(ellipse,#e2a865,#c48644);filter:url(#wc);z-index:-1}
  .branch{position:relative;min-height:150px;width:100%;max-width:640px;display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;padding:10px 10px 12px;isolation:isolate}
  .branch::before{content:"";position:absolute;left:-2%;right:-2%;bottom:0;height:16px;border-radius:10px 20px 8px 30px;background:linear-gradient(#b98a5c,#8d6038);filter:url(#wc);z-index:-1}
  .branch .leaf{position:absolute;bottom:4px;width:36px;height:20px;border-radius:0 100% 0 100%;background:radial-gradient(circle at 30% 30%,#b6df9b,#6db556);filter:url(#wc);z-index:-1}
  .fruit{width:clamp(44px,8vw,64px);height:clamp(44px,8vw,64px);margin:0 1px;flex:none}
  .fruit.drop{animation:drop .65s cubic-bezier(.4,1.6,.6,1) both}
  @keyframes drop{from{transform:translateY(-190px);opacity:0}to{transform:none;opacity:1}}
  .fruit.fly{animation:fly 1.1s ease-in forwards}
  @keyframes fly{to{transform:translate(130px,-210px) rotate(-18deg);opacity:0}}
  .slot{position:relative;display:inline-block}
  .slot .gh{position:absolute;inset:6%;border:3.5px dashed #cdbfdc;border-radius:50%;opacity:0;transition:opacity .6s .6s;filter:url(#wob)}
  .slot.gone .gh{opacity:1}
  .note{font-family:"Neucha","Comfortaa","Trebuchet MS",sans-serif;font-size:24px;color:var(--soft);text-align:center;min-height:1.2em}

  /* ---------- домики ---------- */
  .houses{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .hbtn{width:124px;display:flex;flex-direction:column;align-items:center;transition:transform .15s}
  .hbtn:hover{transform:translateY(-4px)}
  .hbtn:active{transform:scale(.95)}
  .roofbox{position:relative;width:100%}
  .roofbox svg{display:block;width:100%;height:auto;overflow:visible}
  .roofbox b{position:absolute;left:50%;top:44%;transform:translateX(-50%);color:#fff;font-size:28px;text-shadow:0 2px 0 rgba(150,60,50,.35)}
  .hbody{width:82%;padding:10px 6px;display:grid;place-items:center;min-height:76px;margin-top:-3px}
  .hbtn .stars{font-family:"Neucha","Comfortaa","Trebuchet MS",sans-serif;font-size:19px;color:var(--soft);margin-top:6px}
  .split-wrap{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;justify-content:center;width:100%}
  .big-house{width:min(320px,92vw)}
  .big-house .roofbox b{font-size:40px;top:42%}
  .floors{padding:10px;margin:-3px 4% 0}
  .floor{display:grid;grid-template-columns:1fr 8px 1fr;align-items:center;min-height:52px;padding:4px 0;position:relative}
  .floor+.floor:before{content:"";position:absolute;left:4%;right:4%;top:0;border-top:2.5px dashed rgba(214,186,140,.6)}
  .floor .w{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:25px}
  .floor .w.l{color:var(--a)} .floor .w.r{color:var(--b)}
  .floor .mid{height:100%;border-radius:4px;background:linear-gradient(#f3a196,#e3776c);filter:url(#wob)}
  .floor.empty .w{color:#d9cfe2}
  .floor.new{animation:glow 1.2s}
  @keyframes glow{0%{background:rgba(251,216,119,.6)}100%{background:transparent}}
  .mini{display:inline-flex;gap:3px;flex-wrap:wrap;max-width:64px}
  .mini i{width:10px;height:10px;border-radius:50%}
  .mini.ca i{background:radial-gradient(circle at 35% 30%,#f7b2aa,#e0574f 80%)} .mini.cb i{background:radial-gradient(circle at 35% 30%,#a9cbf3,#3f7fcf 80%)}
  .plates{display:flex;gap:14px;width:100%;justify-content:center;flex-wrap:wrap}
  .plate{flex:1;min-width:150px;max-width:300px;min-height:150px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:50%/40%}
  .plate .cnt{font-size:40px;font-weight:700}
  .plate.w-pink .cnt{color:var(--a)} .plate.w-blue .cnt{color:var(--b)}
  .plate .row{min-height:72px}
  .tok.tap{cursor:pointer;transition:transform .15s}
  .tok.tap:hover{transform:scale(1.07)}
  .tok.tap:active{transform:scale(.88)}

  .bigbtn{font-weight:700;font-size:22px;padding:15px 30px;color:#2f5d27;transition:transform .15s}
  .bigbtn:hover{transform:translateY(-2px) rotate(-.6deg)}
  .bigbtn:active{transform:scale(.95)}
  .bigbtn.w-sun{color:#7a5410}

  /* ---------- оверлеи ---------- */
  .toast{position:fixed;left:50%;top:16%;transform:translate(-50%,-20px);padding:14px 28px;font-family:"Neucha","Comfortaa","Trebuchet MS",sans-serif;font-size:36px;opacity:0;pointer-events:none;transition:.25s;z-index:20;display:flex;align-items:center;gap:10px;white-space:nowrap}
  .toast svg{width:40px;height:40px}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .modal{position:fixed;inset:0;background:rgba(74,63,92,.35);display:none;place-items:center;z-index:30;padding:16px}
  .modal.on{display:grid}
  .panel{padding:24px;width:min(470px,100%);display:flex;flex-direction:column;gap:14px}
  .panel h2{margin:0;font-family:"Neucha","Comfortaa","Trebuchet MS",sans-serif;font-weight:400;font-size:32px}
  .opt{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:16px;font-weight:700}
  .seg{display:flex;gap:6px}
  .seg button{min-width:44px;height:44px;padding:0 8px;border-radius:14px 10px 13px 9px;background:rgba(237,228,248,.8);font-weight:700;font-size:17px}
  .seg button.on{background:#7d6f95;color:#fff}
  .final-star{width:clamp(130px,26vw,190px);height:auto;animation:wiggle 2s infinite}
  .final-stars{display:flex;gap:6px;margin:6px 0}
  .final-stars svg{width:clamp(40px,8vw,58px);height:auto}
  .petal{position:fixed;top:-30px;width:16px;height:16px;border-radius:0 100% 0 100%;z-index:40;pointer-events:none;opacity:.85;animation:fall linear forwards;filter:url(#wob)}
  @keyframes fall{to{transform:translateY(112vh) translateX(40px) rotate(540deg)}}

  /* =================== АДАПТАЦИЯ ПОД УСТРОЙСТВА =================== */
  html{-webkit-text-size-adjust:100%}
  body{touch-action:manipulation;overscroll-behavior:none}
  .screen{min-height:100vh;min-height:100dvh;
    padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
  .toast{white-space:normal;max-width:90vw;text-align:center}
  /* размеры подстраиваются и под ширину, и под высоту экрана */
  .bug{width:min(330px,78vw,33vh);width:min(330px,78vw,33dvh)}
  .meadow{height:clamp(150px,26vh,240px)}
  .basket,.branch{min-height:clamp(110px,19vh,170px)}
  .fruit{width:clamp(40px,min(8.5vw,7.5vh),70px);height:clamp(40px,min(8.5vw,7.5vh),70px)}
  .tok{width:clamp(44px,min(8.2vw,8vh),72px);height:clamp(44px,min(8.2vw,8vh),72px)}

  /* на сенсорных экранах не оставляем «залипший» hover */
  @media (hover:none){
    .mode:hover,.icon-btn:hover,.bigbtn:hover,.hbtn:hover,.tok.tap:hover,.ans:not(.right):hover{transform:none}
  }

  /* маленькие телефоны */
  @media (max-width:380px){
    .prompt{font-size:23px}
    .scene{padding:14px 10px;gap:8px}
    .answers{gap:10px}
    .ans{width:88px;padding:10px 6px 12px}
    .ans .dg{font-size:38px}
    .dice{width:52px;height:52px;padding:5px;gap:3px}
    .icon-btn{width:48px;height:48px}
    .mode .pic{height:60px}
    .mode .pic .op{line-height:60px}
    .plate{min-width:130px;min-height:130px}
    .total-tag{font-size:22px}
  }
  @media (max-height:700px) and (orientation:portrait){
    .prompt{font-size:22px}
    .scene{min-height:0;padding:12px 10px;gap:8px}
    .total-tag{font-size:20px;padding:4px 12px}
    .total-tag .dice{width:44px;height:44px}
    .eq{font-size:34px}
    .stage{gap:10px}
    .ans{padding:8px 6px 10px;gap:4px}
    .ans .dg{font-size:34px}
    .ans .dice{width:44px;height:44px;padding:4px;gap:2px}
  }

  /* телефон, повёрнутый горизонтально: картинка слева, ответы справа */
  @media (orientation:landscape) and (max-height:540px){
    .top{margin-bottom:2px}
    .icon-btn{width:44px;height:44px}
    .icon-btn svg{width:26px;height:26px}
    h1{font-size:34px;margin:0}
    .sub{margin-bottom:8px;font-size:15px}
    .group-title{margin:12px 0 8px;font-size:22px}
    .mode .pic{height:54px}
    .mode .pic .op{line-height:54px}
    #game .stage{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 14px}
    #game .stage>.prompt{grid-column:1/-1;font-size:22px}
    #game .stage>.scene{min-height:0;padding:10px 14px;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:6px 18px}
    #game .stage>.answers{flex-direction:column;gap:8px;margin:0}
    .ans{flex-direction:row;width:auto;padding:6px 14px;gap:10px}
    .ans .dg{font-size:36px;min-width:26px}
    .ans .dice{width:46px;height:46px;padding:4px;gap:3px}
    .total-tag{font-size:18px;padding:4px 10px;order:-1}
    .total-tag .dice{width:40px;height:40px;padding:4px;gap:2px}
    .bug{width:min(230px,52vh)}
    .meadow{height:46vh;flex:1 1 320px}
    .basket,.branch{min-height:90px;flex:1 1 320px}
    .fruit{width:44px;height:44px}
    .eq{font-size:32px}
    .note{font-size:18px;flex-basis:100%}
    .split-wrap{flex-wrap:nowrap}
    .split-wrap .scene{padding:10px}
    .plate{min-height:110px}
    .big-house{width:240px}
    .floor{min-height:36px}
    .floor .w{font-size:20px}
  }

  /* планшеты */
  @media (min-width:700px) and (min-height:900px){
    .bug{width:min(400px,60vw,38vh)}
    .meadow{height:260px}
    .fruit{width:76px;height:76px}
    .ans{width:136px}
    .dice{width:72px;height:72px}
    #game .stage{justify-content:center;gap:22px}
    .basket,.branch{min-height:200px}
  }
  /* большие мониторы */
  @media (min-width:1200px) and (min-height:860px){
    .top,.stage,.modes,.group-title{max-width:1120px}
    .prompt{font-size:42px}
    .eq{font-size:64px}
    .bug{width:380px}
    .meadow{max-width:760px;height:270px}
    .basket,.branch{max-width:760px}
    .ans{width:140px}
    .ans .dg{font-size:62px}
    .dice{width:76px;height:76px}
    .mode .pic{height:90px}
    .mode .pic .op{line-height:90px}
  }
  /* широкий экран (ноутбук, планшет боком): божья коровка, «всего» и пример — в одну строку */
  @media (orientation:landscape) and (min-width:700px){
    #game .stage>.scene{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 28px}
    #game .stage>.scene>.meadow,#game .stage>.scene>.basket,#game .stage>.scene>.branch,#game .stage>.scene>.note{flex-basis:100%}
    .bug{width:min(330px,46vh)}
  }
  @media (orientation:landscape) and (max-height:540px){
    .final-star{width:90px}
    #final h1{font-size:30px;margin:4px 0}
    .final-stars svg{width:34px}
    #final .row{margin-top:8px!important}
    #game .stage>.scene>.meadow,#game .stage>.scene>.basket,#game .stage>.scene>.branch{flex:1 1 300px}
    #game .stage>.scene>.note{flex-basis:100%}
  }
</style>
</head>
<body>

<!-- ============ МЕНЮ ============ -->
<section class="screen on" id="menu">
  <div class="top">
    <div style="flex:1"></div>
    <button class="icon-btn wash w-mint mute-btn" title="Звуки вкл/выкл"><svg><use href="#i-on"/></svg></button>
    <button class="icon-btn wash w-lilac" id="btnSettings" title="Настройки"><svg><use href="#i-gear"/></svg></button>
  </div>
  <h1><span class="c1">Числа</span> <span class="c2">до</span> <span class="c3">6</span></h1>
  <p class="sub">Одна часть числа — <span class="ra">красная</span>, другая — <span class="rb">синяя</span>. Так видно, из чего состоит число.</p>

  <div class="group-title">Состав числа</div>
  <div class="modes">
    <button class="mode wash w-peach" data-mode="split"><div class="pic"><svg viewBox="0 0 100 100"><use href="#house"/></svg></div><b>Домик</b><span>Разложи фишки на две тарелки и найди все способы. Каждый способ — новый этаж.</span></button>
    <button class="mode wash w-pink" data-mode="bug"><div class="pic"><svg viewBox="0 0 100 100"><use href="#ladybug"/></svg></div><b>Божья коровка</b><span>Всего точек — как на спинке. Сколько точек на втором крылышке?</span></button>
    <button class="mode wash w-green" data-mode="hide"><div class="pic"><svg viewBox="0 0 100 110"><use href="#bunny"/></svg><svg viewBox="0 0 100 70" style="height:62%;margin-left:-26px"><use href="#bush"/></svg></div><b>Прятки</b><span>Часть зайчиков видно. Сколько спряталось за кустом?</span></button>
  </div>

  <div class="group-title">Примеры</div>
  <div class="modes">
    <button class="mode wash w-yellow" data-mode="plus"><div class="pic"><svg viewBox="0 0 100 100"><use href="#apple-r"/></svg><span class="op">+</span><svg viewBox="0 0 100 100"><use href="#apple-g"/></svg></div><b>Сложение</b><span>В корзине яблоки, сверху падают ещё. Сколько стало? Иногда не падает ни одного.</span></button>
    <button class="mode wash w-blue" data-mode="minus"><div class="pic"><svg viewBox="0 0 100 100"><use href="#bird"/></svg><span class="op">−</span><svg viewBox="0 0 100 100" style="opacity:.35"><use href="#bird"/></svg></div><b>Вычитание</b><span>Птички сидят на ветке, часть улетает. Сколько осталось?</span></button>
    <button class="mode wash w-lilac" data-mode="mix"><div class="pic"><svg viewBox="0 0 100 100"><use href="#dice"/></svg></div><b>Вперемешку</b><span>Сложение и вычитание по очереди, с нулём.</span></button>
  </div>
</section>

<!-- ============ ВЫБОР ДОМИКА ============ -->
<section class="screen" id="housePick">
  <div class="top">
    <button class="icon-btn wash w-peach" data-home title="В меню"><svg><use href="#i-home"/></svg></button>
    <div style="flex:1"></div>
    <button class="icon-btn wash w-mint mute-btn" title="Звуки вкл/выкл"><svg><use href="#i-on"/></svg></button>
  </div>
  <div class="prompt">Выбери домик</div>
  <div class="note" style="margin-bottom:18px">В каждом домике живёт число. Найди все способы его разложить.</div>
  <div class="houses" id="houses"></div>
</section>

<!-- ============ ИГРА ============ -->
<section class="screen" id="game">
  <div class="top">
    <button class="icon-btn wash w-peach" data-home title="В меню"><svg><use href="#i-home"/></svg></button>
    <div class="progress" id="progress"></div>
    <button class="icon-btn wash w-mint mute-btn" title="Звуки вкл/выкл"><svg><use href="#i-on"/></svg></button>
  </div>
  <div class="stage" id="stage"></div>
</section>

<!-- ============ ФИНАЛ ============ -->
<section class="screen" id="final">
  <div class="stage" style="justify-content:center">
    <svg class="final-star" viewBox="0 0 100 100"><use href="#star"/></svg>
    <h1 id="finalTitle">Молодец!</h1>
    <div class="final-stars" id="finalStars"></div>
    <div class="note" id="finalNote"></div>
    <div class="row" style="margin-top:18px">
      <button class="bigbtn wash w-ok" id="btnAgain">Ещё раз</button>
      <button class="bigbtn wash w-sun" data-home>В меню</button>
    </div>
  </div>
</section>

<!-- ============ НАСТРОЙКИ ============ -->
<div class="modal" id="settings">
  <div class="panel wash w-cream">
    <h2>Настройки для взрослого</h2>
    <div class="opt">Числа до <div class="seg" id="segMax"></div></div>
    <div class="opt">Задач в раунде <div class="seg" id="segLen"></div></div>
    <div class="opt">Ноль в задачах <div class="seg" id="segZero"><button data-v="1">да</button><button data-v="0">нет</button></div></div>
    <div class="opt">Звуки <div class="seg" id="segMute"><button data-v="0">вкл</button><button data-v="1">выкл</button></div></div>
    <button class="bigbtn wash w-ok" id="btnClose">Готово</button>
  </div>
</div>

<div class="toast wash w-white" id="toast"></div>

<script>
(() => {
  /* ===================== НАСТРОЙКИ ===================== */
  const S = { max: 6, len: 8, zero: true, mute: false };
  try { Object.assign(S, JSON.parse(localStorage.getItem('chisla6') || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem('chisla6', JSON.stringify(S)); } catch (e) {} };

  const $ = s => document.querySelector(s);
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const pic = (id, cls = 'fruit', vb = '0 0 100 100') => `<svg class="${cls}" viewBox="${vb}"><use href="#${id}"/></svg>`;

  /* ===================== ЗВУК И ГОЛОС ===================== */
  let ac;
  function tone(freq, dur = .15, delay = 0, type = 'sine', vol = .18) {
    if (S.mute) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      const t = ac.currentTime + delay;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch (e) {}
  }
  const sndOk = () => { tone(660, .12); tone(880, .18, .1); };
  const sndBad = () => tone(200, .25, 0, 'triangle', .15);
  const sndPop = () => tone(520 + Math.random() * 200, .08, 0, 'sine', .1);
  const sndWin = () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .2, i * .12));

  function drawMute() {
    document.querySelectorAll('.mute-btn').forEach(b => {
      b.innerHTML = `<svg><use href="#${S.mute ? 'i-off' : 'i-on'}"/></svg>`;
      b.classList.toggle('w-mint', !S.mute); b.classList.toggle('w-pink', S.mute);
      b.title = S.mute ? 'Включить звуки' : 'Выключить звуки';
    });
  }
  function setMute(v) {
    S.mute = v; save(); drawMute();
  }
  document.querySelectorAll('.mute-btn').forEach(b => b.onclick = () => setMute(!S.mute));
  drawMute();

  /* ===================== ЭКРАНЫ ===================== */
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('[data-home]').forEach(b => b.onclick = () => show('menu'));

  function toast(text, ms = 1100) {
    const t = $('#toast'); t.innerHTML = `<svg viewBox="0 0 100 100"><use href="#star"/></svg>${text}`; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
  }
  function confetti(n = 50) {
    const colors = ['#f2867c', '#7fb0ea', '#f9d469', '#a9d877', '#c7a3ea', '#f6b3c1'];
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div'); c.className = 'petal';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = `radial-gradient(circle at 30% 30%, #fff, ${colors[i % colors.length]} 70%)`;
      const sz = 12 + Math.random() * 12; c.style.width = c.style.height = sz + 'px';
      c.style.animationDuration = (2 + Math.random() * 1.8) + 's';
      c.style.animationDelay = Math.random() * .5 + 's';
      document.body.appendChild(c); setTimeout(() => c.remove(), 4500);
    }
  }

  /* ===================== ОТРИСОВКА ЧИСЕЛ ===================== */
  const DICE = { 0: [], 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  const dice = (n, cls = '') => `<div class="dice ${cls}">${[...Array(9)].map((_, i) => `<i class="${DICE[n].includes(i) ? 'on' : ''}"></i>`).join('')}</div>`;
  const mini = (n, cls) => `<span class="mini ${cls}">${'<i></i>'.repeat(n)}</span>`;
  const roof = n => `<div class="roofbox"><svg viewBox="0 0 120 60"><path d="M4 58 L60 4 L116 58Z" fill="url(#gRoof)" filter="url(#wc)"/></svg><b>${n}</b></div>`;

  /* ===================== ОБЩИЙ РАУНД ===================== */
  let R = null;

  function makeTasks(mode) {
    const max = S.max, z = S.zero, list = [], seen = new Set();
    let guard = 0;
    while (list.length < S.len && guard++ < 500) {
      let t;
      const m = mode === 'mix' ? (Math.random() < .5 ? 'plus' : 'minus') : mode;
      if (m === 'bug' || m === 'hide') {
        const N = rnd(z ? 1 : 2, max);
        const k = z ? rnd(0, N) : rnd(1, N - 1);
        t = { m, N, k, ans: N - k };
      } else if (m === 'plus') {
        const a = rnd(z ? 0 : 1, max - (z ? 0 : 1));
        const b = rnd(z ? 0 : 1, max - a);
        t = { m, a, b, ans: a + b };
      } else {
        const a = rnd(1, max);
        const b = z ? rnd(0, a) : rnd(1, Math.max(1, a - 1));
        if (!z && a - b < 1) continue;
        t = { m, a, b, ans: a - b };
      }
      const key = JSON.stringify(t);
      if (seen.has(key) && guard < 300) continue;
      const zeroish = (m === 'bug' || m === 'hide') ? (t.k === 0 || t.ans === 0) : (t.a === 0 || t.b === 0 || t.ans === 0);
      if (zeroish && list.filter(x => x.zeroish).length >= Math.ceil(S.len / 4)) continue;
      t.zeroish = zeroish;
      seen.add(key); list.push(t);
    }
    return list;
  }

  function startRound(mode) {
    R = { mode, i: 0, stars: 0, tasks: makeTasks(mode) };
    show('game'); nextTask();
  }

  function drawProgress() {
    $('#progress').innerHTML = R.tasks.map((t, i) => `<div class="pip ${i < R.i ? 'done' : ''} ${i === R.i ? 'now' : ''}"></div>`).join('');
  }

  function nextTask() {
    if (R.i >= R.tasks.length) return finish();
    drawProgress();
    const t = R.tasks[R.i]; t.tries = 0;
    ({ bug: taskBug, hide: taskHide, plus: taskPlus, minus: taskMinus })[t.m](t);
  }

  function finish() {
    const total = R.tasks.length, got = R.stars;
    const n = Math.max(1, Math.round(got / total * 5));
    $('#finalStars').innerHTML = pic('star', '').repeat(n);
    $('#finalTitle').textContent = got === total ? 'Супер! Без ошибок!' : 'Молодец!';
    $('#finalNote').textContent = `С первого раза: ${got} из ${total}`;
    show('final'); sndWin(); confetti(70);
    
  }
  $('#btnAgain').onclick = () => startRound(R.mode);

  const CARD_W = ['w-cream', 'w-lilac', 'w-peach'];
  function answerCards(t, color, onRight) {
    const opts = new Set([t.ans]);
    const pool = shuffle([...Array(S.max + 1).keys()].filter(v => v !== t.ans && (S.zero || v > 0)));
    pool.sort((x, y) => Math.abs(x - t.ans) - Math.abs(y - t.ans));
    for (const v of pool) { if (opts.size >= 3) break; opts.add(v); }
    const wrap = document.createElement('div'); wrap.className = 'answers';
    shuffle([...opts]).forEach((v, i) => {
      const b = document.createElement('button'); b.className = 'ans wash ' + CARD_W[i % 3]; b.dataset.v = v;
      b.innerHTML = `<div class="dg" style="color:var(--${color})">${v}</div>${dice(v, 'c' + color)}`;
      b.onclick = () => {
        if (wrap.dataset.locked) return;
        if (v === t.ans) {
          wrap.dataset.locked = 1;
          b.classList.add('right'); [...wrap.children].forEach(c => c !== b && c.classList.add('dim'));
          if (t.tries === 0) R.stars++;
          sndOk(); onRight();
        } else {
          t.tries++; b.classList.add('wrong', 'dim'); sndBad();
          setTimeout(() => b.classList.remove('wrong'), 400);
          if (t.tries >= 2) wrap.querySelector(`[data-v="${t.ans}"]`).classList.add('hint');
          
        }
      };
      wrap.appendChild(b);
    });
    return wrap;
  }

  const PRAISE = ['Верно!', 'Правильно!', 'Отлично!', 'Здорово!', 'Умница!'];
  async function goNext() {
    
    toast(PRAISE[rnd(0, PRAISE.length - 1)]);
    await wait(2600);
    R.i++; nextTask();
  }

  /* ===================== БОЖЬЯ КОРОВКА ===================== */
  function taskBug(t) {
    const st = $('#stage');
    st.innerHTML = `
      <div class="prompt">У божьей коровки ${t.N} ${spotsWord(t.N)}. Сколько точек на синем крылышке?</div>
      <div class="scene wash w-white">
        <div class="total-tag wash w-yellow">Всего: ${t.N} ${dice(t.N)}</div>
        <div class="bug"><div class="wrap">
          <div class="ant a1"></div><div class="ant a2"></div>
          <div class="wing l">${wingCells(t.k)}</div>
          <div class="wing r" id="wr">${wingCells(0)}</div>
          <div class="head"></div><div class="eye e1"></div><div class="eye e2"></div>
          <div class="q" id="bq">?</div>
        </div></div>
        <div class="eq"><span>${t.N}</span>=<span class="ca">${t.k}</span>+<span class="q cb" id="eqq">?</span></div>
      </div>`;
    st.appendChild(answerCards(t, 'b', async () => {
      $('#bq').remove();
      const wr = $('#wr'); wr.classList.add('done');
      const cells = wr.children;
      for (const pos of DICE[t.ans]) { await wait(250); cells[pos].innerHTML = '<div class="spot pop"></div>'; sndPop(); }
      const q = $('#eqq'); q.textContent = t.ans; q.classList.add('filled');
      goNext();
    }));
    
  }
  // точки на крыле — как на кубике: 4 квадратом, 6 двумя столбиками
  function wingCells(n) {
    return [...Array(9)].map((_, i) => `<span class="cell">${DICE[n].includes(i) ? '<div class="spot"></div>' : ''}</span>`).join('');
  }
  function spotsWord(n) { return n === 1 ? 'точка' : (n >= 2 && n <= 4 ? 'точки' : 'точек'); }

  /* ===================== ПРЯТКИ ===================== */
  function taskHide(t) {
    const st = $('#stage');
    const bun = pic('bunny', 'bunny', '0 0 100 110');
    st.innerHTML = `
      <div class="prompt">Всего зайчиков: ${t.N}. Сколько спряталось за кустом?</div>
      <div class="scene wash w-white">
        <div class="total-tag wash w-yellow">Всего: ${t.N} ${dice(t.N)}</div>
        <div class="meadow">
          <div class="sky"></div><div class="sunny"></div><div class="cloud"></div><div class="grass"></div>
          <div class="bunnies">
            <div style="width:44%;padding-left:3%">
              <div style="display:flex;justify-content:center;align-items:flex-end;flex-wrap:nowrap">${bun.repeat(t.k)}</div>
              <div class="underline" style="background:${t.k ? 'var(--a)' : 'transparent'}"></div>
            </div>
            <div style="width:53%;margin-left:2%">
              <div id="hid" style="display:flex;justify-content:center;align-items:flex-end;opacity:0;transition:opacity .6s .3s">${bun.repeat(t.ans)}</div>
              <div class="underline" id="ulb" style="background:transparent"></div>
            </div>
          </div>
          <div class="bush" id="bushCover"><i></i><i></i><i></i><i></i><div class="lbl">?</div></div>
        </div>
        <div class="eq"><span>${t.N}</span>=<span class="ca">${t.k}</span>+<span class="q cb" id="eqq">?</span></div>
      </div>`;
    st.appendChild(answerCards(t, 'b', async () => {
      $('#bushCover').classList.add('away'); $('#hid').style.opacity = 1;
      if (t.ans) $('#ulb').style.background = 'var(--b)';
      const q = $('#eqq'); q.textContent = t.ans; q.classList.add('filled');
      goNext();
    }));
    
  }
  function bunWord(n) { return n === 1 ? 'зайчик' : (n >= 2 && n <= 4 ? 'зайчика' : 'зайчиков'); }

  /* ===================== СЛОЖЕНИЕ ===================== */
  async function taskPlus(t) {
    const st = $('#stage');
    st.innerHTML = `
      <div class="prompt" id="pr">В корзине ${t.a} ${appleWord(t.a)}…</div>
      <div class="scene wash w-white">
        <div class="basket" id="bk"></div>
        <div class="note" id="nt">&nbsp;</div>
        <div class="eq"><span class="ca">${t.a}</span>+<span class="cg">${t.b}</span>=<span class="q" id="eqq">?</span></div>
      </div>`;
    const bk = $('#bk');
    bk.innerHTML = pic('apple-r').repeat(t.a);
    if (!t.a) $('#nt').textContent = 'Корзина пустая — ноль яблок';
    
    await wait(1900);
    if (t.b === 0) {
      $('#nt').textContent = 'Ни одно яблоко не упало — плюс ноль';
    } else {
      $('#nt').textContent = `Упало ещё ${t.b} — зелёные`;
      for (let i = 0; i < t.b; i++) { await wait(380); bk.insertAdjacentHTML('beforeend', pic('apple-g', 'fruit drop')); sndPop(); }
    }
    await wait(500);
    $('#pr').textContent = 'Сколько яблок стало?';
    
    st.appendChild(answerCards(t, 'ink', () => {
      const q = $('#eqq'); q.textContent = t.ans; q.classList.add('filled');
      goNext();
    }));
  }
  function appleWord(n) { return n === 1 ? 'яблоко' : (n >= 2 && n <= 4 ? 'яблока' : 'яблок'); }

  /* ===================== ВЫЧИТАНИЕ ===================== */
  async function taskMinus(t) {
    const st = $('#stage');
    st.innerHTML = `
      <div class="prompt" id="pr">На ветке ${t.a} ${birdWord(t.a)}…</div>
      <div class="scene wash w-white">
        <div class="branch" id="br"><i class="leaf" style="left:6%"></i><i class="leaf" style="right:8%;transform:scaleX(-1)"></i></div>
        <div class="note" id="nt">&nbsp;</div>
        <div class="eq"><span class="ca">${t.a}</span>−<span class="cb">${t.b}</span>=<span class="q" id="eqq">?</span></div>
      </div>`;
    const br = $('#br');
    br.insertAdjacentHTML('beforeend', [...Array(t.a)].map(() => `<span class="slot">${pic('bird')}<span class="gh"></span></span>`).join(''));
    
    await wait(1900);
    if (t.b === 0) {
      $('#nt').textContent = 'Никто не улетел — минус ноль';
    } else {
      $('#nt').textContent = `Улетело ${t.b}`;
      const slots = [...br.querySelectorAll('.slot')].slice(-t.b);
      for (const s of slots) { await wait(300); s.querySelector('.fruit').classList.add('fly'); s.classList.add('gone'); tone(900, .08); }
      await wait(900);
    }
    await wait(400);
    $('#pr').textContent = 'Сколько птичек осталось?';
    
    st.appendChild(answerCards(t, 'ink', () => {
      const q = $('#eqq'); q.textContent = t.ans; q.classList.add('filled');
      goNext();
    }));
  }
  function birdWord(n) { return n === 1 ? 'птичка' : (n >= 2 && n <= 4 ? 'птички' : 'птичек'); }

  /* ===================== ДОМИК (РАЗДЕЛИ) ===================== */
  const found = {};
  try { Object.assign(found, Object.fromEntries(Object.entries(JSON.parse(localStorage.getItem('chisla6found') || '{}')).map(([k, v]) => [k, new Set(v)]))); } catch (e) {}
  const saveFound = () => { try { localStorage.setItem('chisla6found', JSON.stringify(Object.fromEntries(Object.entries(found).map(([k, v]) => [k, [...v]])))); } catch (e) {} };
  const needed = N => S.zero ? N + 1 : N - 1;
  const validPair = (a, N) => S.zero || (a > 0 && a < N);

  function drawHouses() {
    const lo = S.zero ? 1 : 2;
    $('#houses').innerHTML = '';
    for (let N = lo; N <= S.max; N++) {
      const have = [...(found[N] || [])].filter(p => validPair(+p.split('+')[0], N)).length;
      const b = document.createElement('button'); b.className = 'hbtn';
      b.innerHTML = `${roof(N)}<div class="hbody wash w-cream">${dice(N)}</div>
        <div class="stars">${have >= needed(N) ? '★ всё найдено' : `найдено ${have} из ${needed(N)}`}</div>`;
      b.onclick = () => splitHouse(N);
      $('#houses').appendChild(b);
    }
  }

  function splitHouse(N) {
    show('game');
    $('#progress').innerHTML = '';
    found[N] = found[N] || new Set();
    const side = Array(N).fill(0);
    const st = $('#stage');
    st.innerHTML = `
      <div class="prompt">Число ${N}. Нажимай на фишки — они переходят на другую тарелку.</div>
      <div class="split-wrap">
        <div class="scene wash w-white" style="flex:1;min-width:280px">
          <div class="plates">
            <div class="plate wash w-pink"><div class="cnt" id="ca">0</div><div class="row" id="pa"></div></div>
            <div class="plate wash w-blue"><div class="cnt" id="cb">0</div><div class="row" id="pb"></div></div>
          </div>
          <div class="eq"><span>${N}</span>=<span class="ca" id="ea">0</span>+<span class="cb" id="eb">0</span></div>
          <button class="bigbtn wash w-ok" id="rec">Записать в домик</button>
          <div class="note" id="nt">&nbsp;</div>
        </div>
        <div class="big-house">${roof(N)}<div class="floors wash w-cream" style="--we:rgba(227,119,108,.6)" id="fl"></div></div>
      </div>`;

    function drawPlates() {
      const pa = $('#pa'), pb = $('#pb'); pa.innerHTML = ''; pb.innerHTML = '';
      side.forEach((s, i) => {
        const d = document.createElement('div'); d.className = 'tok tap ' + (s ? 'rb' : 'ra');
        d.onclick = () => { side[i] ^= 1; sndPop(); drawPlates(); };
        (s ? pb : pa).appendChild(d);
      });
      const a = side.filter(s => !s).length, b = N - a;
      $('#ca').textContent = $('#ea').textContent = a;
      $('#cb').textContent = $('#eb').textContent = b;
    }
    function drawFloors(newKey) {
      const fl = $('#fl'); fl.innerHTML = '';
      for (let a = N; a >= 0; a--) {
        if (!validPair(a, N)) continue;
        const key = a + '+' + (N - a), has = found[N].has(key);
        const f = document.createElement('div'); f.className = 'floor' + (has ? '' : ' empty') + (key === newKey ? ' new' : '');
        f.innerHTML = has
          ? `<div class="w l">${a} ${mini(a, 'ca')}</div><div class="mid"></div><div class="w r">${mini(N - a, 'cb')} ${N - a}</div>`
          : `<div class="w l">?</div><div class="mid"></div><div class="w r">?</div>`;
        fl.appendChild(f);
      }
    }
    drawPlates(); drawFloors();

    $('#rec').onclick = () => {
      const a = side.filter(s => !s).length, b = N - a, key = a + '+' + b;
      if (!validPair(a, N)) { $('#nt').textContent = 'Нужно, чтобы на каждой тарелке что-то было'; sndBad(); return; }
      if (found[N].has(key)) { $('#nt').textContent = 'Такой этаж уже есть. Попробуй по-другому!'; sndBad(); return; }
      found[N].add(key); saveFound(); sndOk(); drawFloors(key);
      $('#nt').textContent = `${N} — это ${a} и ${b}`;
      const have = [...found[N]].filter(p => validPair(+p.split('+')[0], N)).length;
      if (have >= needed(N)) {
        setTimeout(() => { sndWin(); confetti(); toast('Все этажи найдены!', 2000); }, 300);
      }
    };
    
  }

  /* ===================== МЕНЮ ===================== */
  document.querySelectorAll('.mode').forEach(b => b.onclick = () => {
    const m = b.dataset.mode;
    if (m === 'split') { drawHouses(); show('housePick'); }
    else startRound(m);
  });

  /* ===================== НАСТРОЙКИ (UI) ===================== */
  function seg(el, values, key) {
    el.innerHTML = values.map(v => `<button data-v="${v}">${v}</button>`).join('');
    sync(el, key);
  }
  function sync(el, key) {
    el.querySelectorAll('button').forEach(b => {
      const v = b.dataset.v; const cur = typeof S[key] === 'boolean' ? (S[key] ? '1' : '0') : String(S[key]);
      b.classList.toggle('on', v === cur);
      b.onclick = () => { S[key] = typeof S[key] === 'boolean' ? v === '1' : +v; save(); sync(el, key); };
    });
  }
  seg($('#segMax'), [3, 4, 5, 6], 'max');
  seg($('#segLen'), [5, 8, 10], 'len');
  sync($('#segZero'), 'zero'); sync($('#segMute'), 'mute');
  $('#btnSettings').onclick = () => { sync($('#segMute'), 'mute'); $('#settings').classList.add('on'); };
  $('#btnClose').onclick = () => { $('#settings').classList.remove('on'); drawMute(); };
})();
</script>
